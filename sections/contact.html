<!-- Contact Section -->
<section id="contact" class="contact">
    <div class="container">
        <div class="section-header text-center">
            <h2>Let's Connect</h2>
            <p class="section-subtitle">Have a project in mind or just want to say hi? I'd love to hear from you.</p>
        </div>

        <div class="contact-content">
            <div class="contact-info-cards">
                <a href="mailto:rashmikapitigala@gmail.com" class="contact-card">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <p>rashmikapitigala@gmail.com</p>
                </a>
                <a href="https://www.linkedin.com/in/ravindukarunarathne" target="_blank" class="contact-card">
                    <i class="fab fa-linkedin"></i>
                    <h3>LinkedIn</h3>
                    <p>Connect with me</p>
                </a>
                <a href="https://github.com/KarunarathneRR" target="_blank" class="contact-card">
                    <i class="fab fa-github"></i>
                    <h3>GitHub</h3>
                    <p>View my repositories</p>
                </a>
            </div>

            <div class="contact-form-wrapper">
                <form class="contact-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="4" placeholder="How can I help you?" required></textarea>
                    </div>
                    <button type="submit" class="apple-btn primary w-full">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
